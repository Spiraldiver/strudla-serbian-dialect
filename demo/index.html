<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Strudla demo</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: monospace; padding: 16px; }
    h1 { font-size: 16px; color: #8f8; margin: 0 0 4px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 14px; }
    #log { white-space: pre-wrap; font-size: 12px; color: #8f8; background: #0a0a0a;
           padding: 10px; border-radius: 6px; max-height: 60vh; overflow: auto; }
    #log .err { color: #f88; }
    #log .head { color: #6cf; }
    table { border-collapse: collapse; font-size: 12px; margin-top: 12px; }
    td { padding: 1px 14px 1px 0; }
    td.sr { color: #fc8; }
  </style>
</head>
<body>
<h1>Strudla — srpski dijalekt za Strudel</h1>
<div class="sub">
  Ova strana ne pušta zvuk. Proverava da se rečnik učitava i da prevod radi.<br>
  This page plays no audio. It checks that the dictionary loads and translation works.
</div>
<div id="log"></div>
<table id="tbl"></table>

<script type="module">
  const log = (msg, cls = '') => {
    document.getElementById('log').innerHTML += `<span class="${cls}">${msg}</span>\n`;
    console.log('[demo]', msg);
  };
  const origErr = console.error.bind(console);
  console.error = (...a) => { log(a.join(' ').slice(0, 2000), 'err'); origErr(...a); };
  window.addEventListener('error', (e) => log('window error: ' + e.message, 'err'));

  // Minimal Strudel stand-in: Strudla only needs globals plus a Pattern whose
  // prototype it can extend, so the dictionary can be exercised without audio.
  class Pattern {
    constructor() { this.log = []; }
    queryArc() { return []; }
    fast(n) { this.log.push(`.fast(${n})`); return this; }
    rev() { this.log.push('.rev()'); return this; }
    gain(n) { this.log.push(`.gain(${n})`); return this; }
    room(n) { this.log.push(`.room(${n})`); return this; }
    scale(x) { this.log.push(`.scale(${x})`); return this; }
  }
  const mk = (t) => { const p = new Pattern(); p.log.push(t); return p; };
  globalThis.s = (x) => mk(`s("${x}")`);
  globalThis.sound = globalThis.s;
  globalThis.note = (x) => mk(`note("${x}")`);
  globalThis.scale = (x) => mk(`scale("${x}")`);
  globalThis.silence = new Pattern();

  try {
    const q = new URLSearchParams(location.search);
    const locale = q.get('locale') || 'sr-latn';

    const mod = await import('../dist/strudla.js');
    const info = await mod.initStrudla({ locale, quiet: true });

    log(`učitano / loaded: ${info.active.join(', ')}`, 'head');
    log(`  funkcije / functions : ${info.counts.functions}`);
    log(`  zvuci / sounds       : ${info.counts.sounds}`);
    log(`  lestvice / scales    : ${info.counts.scales}`);
    log(`  boje / colors        : ${info.counts.colors}`);

    const cyr = locale === 'sr-cyrl';
    const cases = cyr
      ? [['звук("бубањ добош").брзо(2)', () => globalThis.звук('бубањ добош').брзо(2)],
         ['звук("бубањ*2 [пљесак чинела]")', () => globalThis.звук('бубањ*2 [пљесак чинела]')]]
      : [['zvuk("bubanj doboš").brzo(2)', () => globalThis.zvuk('bubanj doboš').brzo(2)],
         ['zvuk("bubanj*2 [pljesak činela]")', () => globalThis.zvuk('bubanj*2 [pljesak činela]')],
         ['zvuk("testera").jacina(0.8).soba(0.3)',
          () => globalThis.zvuk('testera').jacina(0.8).soba(0.3)],
         ['scale("c:dur")', () => globalThis.scale('c:dur')]];

    log('\nprevod / translation', 'head');
    for (const [src, fn] of cases) {
      try { log(`  ${src}\n    -> ${fn().log.join('')}`); }
      catch (e) { log(`  ${src}\n    -> ${e.message}`, 'err'); }
    }

    log('\nkonstante / constants', 'head');
    log(`  sredina=${globalThis.sredina}  vrh=${globalThis.vrh}  crvena=${globalThis.crvena}`);

    // full dictionary, Serbian -> English
    const rows = Object.entries(info.functions)
      .sort((a, b) => a[0].localeCompare(b[0], 'sr'));
    document.getElementById('tbl').innerHTML =
      '<tr><td class="sr"><b>Strudla</b></td><td><b>Strudel</b></td></tr>' +
      rows.map(([sr, en]) => `<tr><td class="sr">${sr}</td><td>${en}</td></tr>`).join('');

    log(`\nOK — ${rows.length} psevdonima aktivno. Dodaj ?locale=sr-cyrl za ćirilicu.`, 'head');
  } catch (e) {
    log('FAILED: ' + (e && e.stack || e), 'err');
  }
</script>
</body>
</html>
